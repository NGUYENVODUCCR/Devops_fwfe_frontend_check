name: CI/CD for Flutter Frontend (Web)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      # Flutter doctor
      - name: Flutter doctor
        run: flutter doctor

      # Build Docker image with secret API_BASE_URL
      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/fwfe-frontend:latest
          docker build \
            --build-arg API_BASE_URL=${{ secrets.API_BASE_URL }} \
            -t $IMAGE_NAME .

      # Login Docker Hub
      - name: Docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Push Docker image
      - name: Push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/fwfe-frontend:latest
          docker push $IMAGE_NAME

      # Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASS }}
          script: |
            IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/fwfe-frontend:latest
            docker pull $IMAGE_NAME
            docker stop fwfe-frontend || true
            docker rm fwfe-frontend || true
            docker run -d --name fwfe-frontend -p 80:80 $IMAGE_NAME
            echo "✅ Deploy thành công!"
